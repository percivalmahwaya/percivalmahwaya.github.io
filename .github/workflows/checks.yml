name: checks
on:
  push:
  pull_request:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

jobs:
  facts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh accuracy.json from the engine
        run: |
          curl -fsSL https://raw.githubusercontent.com/percivalmahwaya/fpl-decision-engine/main/site/data/accuracy.json -o /tmp/accuracy.json
          if ! cmp -s /tmp/accuracy.json data/accuracy.json; then
            cp /tmp/accuracy.json data/accuracy.json
            python3 tools/facts.py
            echo "accuracy.json changed; pages rewritten for this run only"
          fi
      - name: Fail if any page disagrees with the data
        run: python3 tools/facts.py --check

  quality:
    runs-on: ubuntu-latest
    needs: facts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Install tools
        run: |
          npm install --no-save @lhci/cli@0.14.0 @axe-core/cli@4.10.0 vnu-jar@23.4.11 playwright@1.48.0
          npx playwright install --with-deps chromium firefox webkit
      - name: HTML validity (Nu)
        run: java -jar node_modules/vnu-jar/build/dist/vnu.jar --errors-only --skip-non-html *.html
      - name: Lighthouse CI (all four categories >= 0.95)
        run: npx lhci autorun --config=lighthouserc.json
      - name: axe (zero violations)
        run: |
          python3 -m http.server 8080 &
          sleep 2
          for p in index about projects certifications contact case-fpl-decision-engine case-bulawayo-chess-hub case-osp-scout; do
            npx axe http://localhost:8080/$p.html --exit
          done
      - name: Browser matrix (3 engines, 2 themes, 2 widths)
        run: |
          python3 -m http.server 8080 &
          sleep 2
          node tools/matrix.mjs
      - name: Links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --offline --include-fragments "./*.html"
